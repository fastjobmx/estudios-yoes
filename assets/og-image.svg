<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>
  <!-- Border frame -->
  <rect x="28" y="28" width="1144" height="574" fill="none" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.3" rx="12"/>
  <!-- Top label -->
  <text x="600" y="200" font-family="Georgia,serif" font-size="13" fill="#F0D58C" fill-opacity="0.6" letter-spacing="6" text-anchor="middle" font-weight="bold">ESCUELA DE AUTO-CONOCIMIENTO</text>
  <!-- Main title -->
  <text x="600" y="300" font-family="Georgia,serif" font-size="72" fill="#F6F0E7" letter-spacing="-2" text-anchor="middle" font-weight="normal">Conciencia</text>
  <text x="600" y="380" font-family="Georgia,serif" font-size="72" fill="#C6A15B" letter-spacing="-2" text-anchor="middle" font-weight="normal">Revolucionaria</text>
  <!-- Divider -->
  <line x1="480" y1="415" x2="720" y2="415" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Subtitle -->
  <text x="600" y="455" font-family="Georgia,serif" font-size="18" fill="#F6F0E7" fill-opacity="0.45" letter-spacing="2" text-anchor="middle">74 Conferencias · Los Tres Factores · Estudios de los Yoes</text>
  <!-- Halo circle decorative -->
  <circle cx="600" cy="120" r="30" fill="none" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="600" cy="120" r="6"  fill="#F0D58C" fill-opacity="0.6"/>
  <line x1="600" y1="90"  x2="600" y2="100" stroke="#C6A15B" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="600" y1="140" x2="600" y2="150" stroke="#C6A15B" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="570" y1="120" x2="580" y2="120" stroke="#C6A15B" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="620" y1="120" x2="630" y2="120" stroke="#C6A15B" stroke-opacity="0.4" stroke-width="1"/>
</svg>
